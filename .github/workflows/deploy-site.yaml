name: Deploy portfolio to GitHub Pages
# Pulls the latest static assets and the authoritative uploaded resume PDF from jeevanragula/portfolio.
# Publishes the latest Products/Projects split, keeps the payment gateway after ZPC, routes Explore Work to Products, and keeps the authoritative resume PDF.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: site-config

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: jeevanragula/portfolio
          ref: main
          path: portfolio-source

      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp portfolio-source/index.html portfolio-source/index.css portfolio-source/app.js public/
          cp portfolio-source/data/career.json portfolio-source/data/career.schema.json public/data/
          cp portfolio-source/JeevanReddyRagula_Resume.pdf public/resume.pdf
          touch public/.nojekyll

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
